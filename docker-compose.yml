services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - secret-santa-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - secret-santa-network

  postgres-user:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: user_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - secret-santa-network

  postgres-group:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: group_db
      POSTGRES_USER: group_admin
      POSTGRES_PASSWORD: group_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-group-data:/var/lib/postgresql/data
    networks:
      - secret-santa-network


  postgres-wishlist:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wishlist_db
      POSTGRES_USER: wishlist_admin
      POSTGRES_PASSWORD: wishlist_pass
    ports:
      - "5435:5432"
    volumes:
      - postgres-wishlist-data:/var/lib/postgresql/data
    networks:
      - secret-santa-network

  mongodb-notification:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: notification_db
    volumes:
      - mongodb-notification-data:/data/db

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: secret-santa-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - secret-santa-network

volumes:
  postgres-user-data:
  postgres-group-data:
  mongodb-notification-data:
  postgres-wishlist-data:

networks:
  secret-santa-network:
    driver: bridge