spring.application.name=user-service
spring.profiles.active=local


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID}

kafka.topics.user-commands=${KAFKA_TOPIC_USER_COMMANDS}
kafka.topics.auth-commands=${KAFKA_TOPIC_AUTH_COMMANDS:auth.commands}
kafka.topics.user-events=${KAFKA_TOPIC_USER_EVENTS}
kafka.topics.notification-events=${KAFKA_TOPIC_NOTIFICATION_EVENTS:notification.events}
kafka.topics.notification-retention=${KAFKA_NOTIFICATION_RETENTION:PT1H}
kafka.topics.notification-partitions=${KAFKA_NOTIFICATION_PARTITIONS:1}
kafka.topics.notification-replicas=${KAFKA_NOTIFICATION_REPLICAS:1}

security.refresh-token-ttl=${REFRESH_TOKEN_TTL:PT168H}
security.refresh-token-family-ttl=${REFRESH_TOKEN_FAMILY_TTL:PT720H}
security.email-verification-token-ttl=${EMAIL_VERIFICATION_TOKEN_TTL:PT24H}
