spring.application.name=api-gateway
spring.profiles.active=local

server.port=${SERVER_PORT:8081}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:api-gateway}

kafka.topics.user-commands=${KAFKA_TOPIC_USER_COMMANDS:user.commands}
kafka.topics.auth-commands=${KAFKA_TOPIC_AUTH_COMMANDS:auth.commands}
kafka.topics.group-commands=${KAFKA_TOPIC_GROUP_COMMANDS:group.commands}
kafka.topics.user-events=${KAFKA_TOPIC_USER_EVENTS:user.events}
kafka.topics.group-events=${KAFKA_TOPIC_GROUP_EVENTS:group.events}
kafka.topics.auth-retention=${KAFKA_AUTH_RETENTION:PT5M}
kafka.topics.auth-partitions=${KAFKA_AUTH_PARTITIONS:1}
kafka.topics.auth-replicas=${KAFKA_AUTH_REPLICAS:1}

kafka.reply.enabled=true
kafka.reply.timeout-seconds=${KAFKA_REPLY_TIMEOUT_SECONDS:5}

security.jwt.issuer=${JWT_ISSUER:secret-santa-api-gateway}
security.jwt.audience=${JWT_AUDIENCE:secret-santa-api}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
security.jwt.private-key-base64=${JWT_PRIVATE_KEY_BASE64:}
security.jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64:}

security.refresh-cookie.name=${REFRESH_COOKIE_NAME:refresh_token}
security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Strict}
