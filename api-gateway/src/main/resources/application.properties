spring.application.name=api-gateway
spring.profiles.active=local

server.port=${SERVER_PORT}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID}

kafka.topics.user-commands=${KAFKA_TOPIC_USER_COMMANDS}
kafka.topics.group-commands=${KAFKA_TOPIC_GROUP_COMMANDS}
kafka.topics.user-events=${KAFKA_TOPIC_USER_EVENTS}
kafka.topics.group-events=${KAFKA_TOPIC_GROUP_EVENTS}

kafka.reply.enabled=true
kafka.reply.timeout-seconds=${KAFKA_REPLY_TIMEOUT_SECONDS:5}

security.jwt.secret-base64=${JWT_SECRET_BASE64}
security.jwt.issuer=${JWT_ISSUER:https://secret-santa-api}
security.jwt.audience=${JWT_AUDIENCE:secret-santa-api}
security.credentials.public-key-base64=${USER_AUTH_PUBLIC_KEY_BASE64}
